[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voronoi-delaunay-clearance"
version = "1.0.0"
description = "Every gap between conductors closer than its requirement, found on the clearance curve (the Voronoi diagram of the copper)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "shapely>=2.0"]
keywords = ["clearance", "voronoi", "delaunay", "pcb", "electrical spacing", "computational geometry"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[tool.setuptools]
packages = ["clearance_curve"]
